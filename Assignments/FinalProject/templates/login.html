<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/login.js" defer></script>
    <title>DevKanban – Sign in</title>
</head>
<body>
<header><h1>⚡ DevKanban</h1></header>

<main class="auth-wrapper">
    <form id="auth-form" class="modal-body">
        <h3 id="auth-title">Sign in</h3>
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <p id="auth-error" class="error" hidden></p>
        <div style="display:flex; justify-content:space-between; gap:.5rem;">
            <button type="button" id="toggle-mode" class="btn btn-outline">Create account</button>
            <button type="submit" id="submit-btn" class="btn">Sign in</button>
        </div>
    </form>
</main>
</body>
</html>
