<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Uppgift 6.3 i kursen WPROG2 på SU.">
    <meta name="keywords" content="HTML">
    <meta name="author" content="Björn Moderatho Winther">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
    <title>Kanban Dev - WPROG2 Gesällprov</title>
</head>
<body>
<header>
    <h1>⚡ DevKanban</h1>
    <div id="auth-controls">
        <button class="btn" onclick="openModal('card-modal')">+ New Task</button>
        <button class="btn btn-outline" onclick="logout()">Logout</button>
    </div>
</header>

<div class="board" id="board">
    <div class="column" data-status="backlog"><div class="col-header">Backlog <span class="count">0</span></div><div class="cards-list"></div></div>
    <div class="column" data-status="in_progress"><div class="col-header">In Progress <span class="count">0</span></div><div class="cards-list"></div></div>
    <div class="column" data-status="code_review"><div class="col-header">Code Review <span class="count">0</span></div><div class="cards-list"></div></div>
    <div class="column" data-status="testing"><div class="col-header">Testing <span class="count">0</span></div><div class="cards-list"></div></div>
    <div class="column" data-status="done"><div class="col-header">Done <span class="count">0</span></div><div class="cards-list"></div></div>
</div>

<!-- Create Card Modal -->
<div class="modal" id="card-modal">
    <div class="modal-body">
        <h3>Create Software Task</h3>
        <div class="form-group"><label>Title</label><input type="text" id="card-title" class="form-control" required placeholder="e.g. Fix memory leak in auth worker"></div>
        <div class="form-group"><label>Description</label><textarea id="card-desc" class="form-control" rows="3"></textarea></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <div class="form-group"><label>Type</label><select id="card-type" class="form-control"><option value="bug">Bug</option><option value="feature" selected>Feature</option><option value="tech_debt">Tech Debt</option></select></div>
            <div class="form-group"><label>Priority</label><select id="card-priority" class="form-control"><option value="P0">P0 (Blocker)</option><option value="P1">P1</option><option value="P2" selected>P2</option><option value="P3">P3</option><option value="P4">P4</option></select></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <div class="form-group"><label>Story Points</label><input type="number" id="card-sp" class="form-control" value="2"></div>
            <div class="form-group"><label>Git Branch</label><input type="text" id="card-branch" class="form-control" placeholder="fix/auth-leak"></div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
            <button class="btn btn-outline" onclick="closeModal('card-modal')">Cancel</button>
            <button class="btn" onclick="submitCard()">Create Card</button>
        </div>
    </div>
</div>

</body>
</html>
