services:
  mariadb:
    image: mariadb:10.11
    container_name: wprog2_db_6.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: guestbook_db
      MARIADB_USER: guestbook_user
      MARIADB_PASSWORD: ${GUESTBOOK_DB_PASSWORD:?Set GUESTBOOK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/002-runtime-grants.sql:/docker-entrypoint-initdb.d/002-runtime-grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: